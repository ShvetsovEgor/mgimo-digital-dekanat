# Nginx для прототипа «Дедлайн» на домене бизнестарт.рф (xn--80abmhe5axgjc.xn--p1ai).
# Приложение слушает 127.0.0.1:8080 (Docker: -p 127.0.0.1:8080:8080).
# Сертификат выпускается certbot --nginx, пути ниже он подставит сам.
#
#   sudo cp deploy/nginx-businessstart.conf /etc/nginx/sites-available/businessstart.conf
#   sudo ln -s /etc/nginx/sites-available/businessstart.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d xn--80abmhe5axgjc.xn--p1ai

server {
    listen 80;
    listen [::]:80;
    server_name xn--80abmhe5axgjc.xn--p1ai;

    # certbot добавит сюда редирект на HTTPS и блок с сертификатом
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xn--80abmhe5axgjc.xn--p1ai;

    # Пути подставит certbot; при ручном выпуске замените на свои.
    ssl_certificate     /etc/letsencrypt/live/xn--80abmhe5axgjc.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80abmhe5axgjc.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    # Заголовки безопасности приложение отдаёт само (CSP, HSTS, X-Frame-Options),
    # здесь только проксирование и реальный IP клиента.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
