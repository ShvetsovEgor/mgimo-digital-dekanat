<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F5F1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Дедлайн — демонстрационный личный кабинет студента. Неофициальный сервис, все данные вымышлены."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap"
    />
    <title>Дедлайн · Цифровой деканат 2030</title>
    <script>
      // Тема до первой отрисовки — без мигания белым.
      (function () {
        try {
          var stored = localStorage.getItem('deadline:theme');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.themeMode = mode;
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0B1120' : '#F6F5F1');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: system-ui, sans-serif">
        Для работы кабинета нужен JavaScript. Включите его в настройках браузера и обновите страницу.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
